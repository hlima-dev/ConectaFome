name: Manutenção do ConectaFome

# Roda a cada 15 minutos e faz duas coisas:
#  1. acorda o servidor gratuito do Render (que dorme depois de ~15 min sem uso) e toca o
#     banco, o que também evita o Supabase gratuito pausar por inatividade;
#  2. executa a rotina de manutenção: vence doações fora do prazo e devolve ao painel as
#     reservas que ficaram paradas.
#
# Precisa de dois "secrets" no GitHub (Settings → Secrets and variables → Actions):
#   API_URL      endereço do backend, sem barra no final (ex.: https://conectfome-backend.onrender.com)
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET no Render
#
# Observações: o GitHub pode atrasar execuções agendadas em alguns minutos, e em
# repositórios públicos DESATIVA agendamentos após 60 dias sem atividade no repositório
# (basta um commit ou reativar em Actions).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: manutencao
  cancel-in-progress: false

jobs:
  manutencao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir configuração
        id: cfg
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Secrets API_URL e CRON_SECRET não configurados: nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Acordar o servidor e rodar a manutenção
        if: steps.cfg.outputs.ready == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # O Render gratuito pode levar ~1 min para acordar: tenta algumas vezes.
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/health" > /dev/null
          curl -fsS --retry 2 --retry-delay 10 --max-time 60 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/api/v1/maintenance/run"
          echo
