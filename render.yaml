# Blueprint do Render pro backend do ConectaFome.
# Uso: no dashboard do Render, "New +" → "Blueprint" → conectar o repo
# hlima-dev/ConectaFome → o Render lê este arquivo e monta o serviço abaixo.
# O banco (Postgres) é externo — Supabase, do mesmo jeito que o ATHLO usa —
# porque o Postgres gratuito do próprio Render expira depois de 30 dias.
# DATABASE_URL e CORS_ORIGINS ficam marcados "sync: false": o Render pede
# esses valores na hora de aplicar o blueprint, não ficam hardcoded aqui.
services:
  - type: web
    name: conectfome-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    # O Render só considera o deploy saudável quando /health responde 200.
    healthCheckPath: /health
    buildCommand: npm install --legacy-peer-deps && npm run db:generate && npm run build
    startCommand: npm run db:migrate:prod && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Administrador inicial. Em produção o seed cria SÓ esta conta (sem os
      # dados de demonstração, que têm senha pública). Defina uma senha forte.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      # Segredo do agendador (GitHub Actions, .github/workflows/manutencao.yml). O Render
      # gera o valor; copie-o do painel para o secret CRON_SECRET do GitHub.
      - key: CRON_SECRET
        generateValue: true
      # Cadastros novos esperam aprovação da administração antes de doar/reservar.
      - key: REQUIRE_APPROVAL
        value: "true"
      # Horas que uma reserva do próprio receptor pode ficar sem rota antes de voltar ao painel.
      - key: RESERVATION_HOLD_HOURS
        value: "24"
      # Fotos: guardadas no Supabase Storage (bucket privado). Sem SUPABASE_URL e
      # SUPABASE_SERVICE_KEY o recurso de fotos fica desligado (e nada é exigido).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: doacoes
      # Com o armazenamento configurado: oferta sem foto não aparece para reserva e a
      # coleta de cada parada exige foto.
      - key: REQUIRE_OFFER_PHOTO
        value: "true"
      - key: REQUIRE_PICKUP_PHOTO
        value: "true"
      # E-mail (opcional; sem estas, o sistema funciona só com os avisos dentro do app).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Render (1) + proxy da Vercel na frente (2): o IP real do cliente vem do
      # X-Forwarded-For, pra o limite de tentativas ser por pessoa.
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
